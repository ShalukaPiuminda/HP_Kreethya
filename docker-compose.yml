name: hire-purchase-erp

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_laravel_api
    restart: unless-stopped
    environment:
      APP_NAME: "Hire Purchase ERP"
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:Xfc9sekJv/di0VVVKrK/6bkBQrGqr8yk4To7bFaBXq8=}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8008
      APP_TIMEZONE: Asia/Colombo
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-erp_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000,127.0.0.1:3000,localhost:3001,127.0.0.1:3001}
    volumes:
      - ./backend:/var/www/html
      - api_vendor:/var/www/html/vendor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - erp_network

  nginx:
    image: nginx:1.29-alpine
    container_name: erp_webserver
    restart: unless-stopped
    ports:
      - "${API_FORWARD_PORT:-8008}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8008/api
        NEXT_PUBLIC_APP_URL: http://localhost:3001
    container_name: erp_next_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8008/api
      NEXT_PUBLIC_APP_URL: http://localhost:3001
    ports:
      - "${FRONTEND_FORWARD_PORT:-3001}:3000"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - erp_network

networks:
  erp_network:
    driver: bridge

volumes:
  api_vendor:
